[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sam-aydev", email = "samadet0001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
